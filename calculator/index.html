<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f5f0e7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1d211f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="算算">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <title>算算｜完整算式一鍵分享</title>
  <style>
    :root{color-scheme:light;--bg:#f5f0e7;--glow:#e5ddd0;--card:#fffdf8e8;--key:#fffdf9;--text:#3f4843;--muted:#8a8d84;--line:#ded8cc;--accent:#789287;--deep:#536b61;--soft:#e8eee9;--clay:#c88972;--danger:#b96968;--shadow:0 14px 40px #655e5120}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#1d211f;--glow:#30352f;--card:#282d2ae8;--key:#303632;--text:#eeeae0;--muted:#aaa99f;--line:#414741;--accent:#9ab4a8;--deep:#b9cdc3;--soft:#35423c;--clay:#d59a82;--danger:#dc8d8b;--shadow:0 16px 46px #0005}}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}body{background-image:radial-gradient(circle at 20% 0,var(--glow),transparent 38%),radial-gradient(circle at 90% 40%,var(--glow),transparent 28%)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .app{width:min(100%,500px);height:100dvh;overflow:hidden;margin:auto;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#a9b9af,var(--accent));display:grid;place-items:center;color:#33443c;font-family:Georgia,serif;font-size:21px;font-weight:900;box-shadow:0 7px 18px #536b6130}.brand h1{font-family:Georgia,"Noto Serif TC",serif;font-size:20px;letter-spacing:.12em;margin:0}.brand p{font-size:10px;color:var(--muted);margin:1px 0 0;letter-spacing:.08em}.header-actions{display:flex;align-items:center;gap:7px}.history-toggle,.install{border:1px solid var(--line);background:var(--card);height:36px;border-radius:999px;font-size:12px;font-weight:750;box-shadow:var(--shadow)}.history-toggle{width:36px;padding:0;display:grid;place-items:center}.history-toggle svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8}.install{padding:0 12px}.install[hidden]{display:none}
    .screen{background:var(--card);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:22px;padding:14px 16px;min-height:139px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow)}.expression{min-height:23px;text-align:right;color:var(--muted);font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.result{text-align:right;font:720 clamp(34px,11vw,52px)/1.08 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;white-space:nowrap}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.actions button{border:1px solid var(--line);background:var(--soft);color:var(--deep);border-radius:11px;padding:9px 7px;font-size:11px;font-weight:750}.actions svg,.item-actions svg{width:14px;height:14px;vertical-align:-3px;margin-right:5px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;min-height:0}.key{height:auto;min-height:46px;border:1px solid var(--line);border-radius:16px;background:var(--key);font-size:21px;font-weight:650;box-shadow:0 4px 12px #645c500c;touch-action:manipulation}.key:active{transform:scale(.96);filter:brightness(.96)}.key.utility{color:var(--danger)}.key.op{color:var(--deep);background:var(--soft)}.key.equal{background:linear-gradient(145deg,var(--clay),#b97a65);color:#fffaf4;border:0;box-shadow:0 7px 19px #b97a6535}.key.zero{grid-column:span 2}
    .history-head{display:flex;align-items:end;justify-content:space-between;margin-top:5px}.history-head h2{font-size:15px;margin:0}.history-head span{font-size:10px;color:var(--muted)}.history{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}.empty{text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:17px;padding:22px}.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:7px 12px;align-items:center}.item .equation{font:700 17px ui-monospace,monospace;overflow-wrap:anywhere}.item .date{font-size:10px;color:var(--muted)}.item-actions{grid-row:1/3;grid-column:2;display:flex;gap:6px}.item-actions button{border:0;background:var(--soft);color:var(--deep);border-radius:10px;padding:9px;font-size:0}.item-actions svg{margin:0}
    .dialog-wrap{position:fixed;inset:0;background:#25231f80;display:grid;place-items:end center;padding:12px;z-index:20}.dialog-wrap[hidden]{display:none}.dialog{width:min(100%,480px);background:var(--bg);border:1px solid var(--line);border-radius:23px;padding:18px;box-shadow:0 25px 80px #0005}.dialog-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.dialog h2{font-family:Georgia,"Noto Serif TC",serif;font-size:18px;letter-spacing:.06em;margin:0}.dialog p{font-size:13px;color:var(--muted);line-height:1.65;margin:0}.history-dialog .history{max-height:min(58vh,430px)}.close-icon{width:32px;height:32px;border:1px solid var(--line);background:var(--card);border-radius:50%;font-size:18px}.steps{margin:15px 0 18px;padding:0;list-style:none;display:grid;gap:9px;counter-reset:step}.steps li{counter-increment:step;display:flex;gap:9px;font-size:13px;align-items:center}.steps li:before{content:counter(step);width:25px;height:25px;border-radius:50%;background:var(--soft);color:var(--deep);display:grid;place-items:center;font-weight:900;flex:0 0 auto}.dialog-close{width:100%;border:0;border-radius:14px;padding:12px;background:var(--accent);color:#fff;font-weight:900}.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);border-radius:999px;padding:10px 16px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:650px){.app{gap:7px}.screen{min-height:120px;padding:10px 14px}.actions{margin-top:7px}.key{min-height:40px}}
  </style>
</head>
<body>
  <main class="app"><header><div class="brand"><div class="logo">=</div><div><h1>算算</h1><p>把日常，算得剛剛好</p></div></div><div class="header-actions"><button id="history-toggle" class="history-toggle" aria-label="開啟歷史紀錄"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2M5.8 5.8 4 4"/></svg></button><button id="install" class="install">安裝 App</button></div></header>
    <section class="screen" aria-live="polite"><div id="expression" class="expression">準備開始計算</div><div id="result" class="result">0</div><div class="actions"><button id="copy-full"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>複製完整算式</button><button id="share-full"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>分享到其他 App</button></div></section>
    <section class="keys" aria-label="計算機按鍵"><button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="back">⌫</button><button class="key op" data-value="÷">÷</button><button class="key op" data-value="×">×</button><button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key op" data-value="-">−</button><button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key op" data-value="+">+</button><button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key op" data-action="percent">%</button><button class="key zero" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key equal" data-action="equals">=</button></section>
  </main>
  <div id="history-dialog" class="dialog-wrap" hidden><section class="dialog history-dialog" role="dialog" aria-modal="true" aria-labelledby="history-title"><div class="dialog-title"><div><h2 id="history-title">最近計算</h2><p>只存在這台裝置・30 天後清除</p></div><button id="history-close" class="close-icon" aria-label="關閉歷史紀錄">×</button></div><section id="history" class="history"></section></section></div>
  <div id="install-dialog" class="dialog-wrap" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="install-title"><h2 id="install-title">安裝「算算」</h2><p id="install-intro"></p><ol id="install-steps" class="steps"></ol><button id="dialog-close" class="dialog-close">我知道了</button></section></div><div id="toast" class="toast" role="status"></div><script src="./app.js"></script>
</body></html>
