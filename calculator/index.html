<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#151822">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="算算">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>算算｜計算過程可複製</title>
  <style>
    :root{color-scheme:dark;--bg:#0d0f16;--panel:#171a24;--panel2:#202431;--text:#f7f5ef;--muted:#9298aa;--accent:#ffb45b;--accent2:#ff8b5b;--line:#2c3140;--danger:#ff7272}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit}button:focus-visible{outline:3px solid #fff8;outline-offset:2px}
    .app{width:min(100%,520px);min-height:100dvh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
    header{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#22150b;font-size:21px;font-weight:900}.brand h1{font-size:20px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:2px 0 0}
    .install{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:700}.install[hidden]{display:none}
    .screen{background:linear-gradient(160deg,#1d212d,#141720);border:1px solid var(--line);border-radius:24px;padding:18px;min-height:154px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 20px 60px #0005}.expression{min-height:28px;text-align:right;color:var(--muted);font:500 18px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.result{text-align:right;font:700 clamp(36px,12vw,58px)/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;white-space:nowrap}.copybar{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.copybar button{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px;font-size:12px;font-weight:700}
    .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{height:60px;border:0;border-radius:18px;background:var(--panel2);font-size:22px;font-weight:650;box-shadow:inset 0 -2px 0 #0003;touch-action:manipulation}.key:active{transform:scale(.96);filter:brightness(1.15)}.key.utility{color:var(--danger);background:#2a2028}.key.op{color:var(--accent);background:#29251f}.key.equal{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#25170b}.key.zero{grid-column:span 2}
    .history-head{display:flex;align-items:end;justify-content:space-between;margin-top:4px}.history-head h2{font-size:15px;margin:0}.history-head span{font-size:10px;color:var(--muted)}.history{display:flex;flex-direction:column;gap:8px;max-height:250px;overflow:auto}.empty{text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:16px;padding:22px}.item{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:11px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}.item button{grid-row:1/3;grid-column:2;border:0;background:#ffffff0a;border-radius:10px;padding:9px 11px;font-size:12px}.item .formula{font:12px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}.item .answer{font:700 18px ui-monospace,monospace}.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#f7f5ef;color:#161820;border-radius:999px;padding:10px 16px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-height:720px){.key{height:52px}.screen{min-height:125px}.history{max-height:170px}}
  </style>
</head>
<body>
  <main class="app">
    <header><div class="brand"><div class="logo">=</div><div><h1>算算</h1><p>過程與結果，都能帶走</p></div></div><button id="install" class="install" hidden>安裝 App</button></header>
    <section class="screen" aria-live="polite">
      <div id="expression" class="expression">準備開始計算</div>
      <div id="result" class="result">0</div>
      <div class="copybar"><button id="copy-process">複製過程</button><button id="copy-result">複製結果</button></div>
    </section>
    <section class="keys" aria-label="計算機按鍵">
      <button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="back">⌫</button><button class="key op" data-value="÷">÷</button><button class="key op" data-value="×">×</button>
      <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key op" data-value="-">−</button>
      <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key op" data-value="+">+</button>
      <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key equal" data-action="equals">=</button>
      <button class="key zero" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key op" data-action="percent">%</button>
    </section>
    <div class="history-head"><h2>最近計算</h2><span>只存在這台裝置・30 天後自動清除</span></div>
    <section id="history" class="history"></section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
