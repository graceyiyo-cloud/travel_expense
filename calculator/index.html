<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#edf9f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#101c20" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="算算">
  <link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <title>算算｜完整算式一鍵分享</title>
  <style>
    :root{color-scheme:light;--bg:#edf9f7;--glow:#d7f4ee;--card:#ffffffd9;--key:#fff;--text:#183235;--muted:#71888a;--line:#d8e9e6;--accent:#24a998;--deep:#168579;--soft:#dff5f1;--danger:#e56f75;--shadow:0 16px 50px #4b8e8520}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101c20;--glow:#153b39;--card:#18282dcc;--key:#203338;--text:#eefaf8;--muted:#91aaa9;--line:#2b4448;--accent:#5bd2bf;--deep:#5bd2bf;--soft:#1c3c3a;--danger:#ff8c92;--shadow:0 18px 55px #0005}}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}body{background-image:radial-gradient(circle at 20% 0,var(--glow),transparent 38%),radial-gradient(circle at 90% 40%,var(--glow),transparent 28%)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .app{width:min(100%,520px);min-height:100dvh;margin:auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#74dfcf,var(--accent));display:grid;place-items:center;color:#083c37;font-size:22px;font-weight:900;box-shadow:0 9px 24px #24a99835}.brand h1{font-size:20px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:2px 0 0}.install{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;box-shadow:var(--shadow)}.install[hidden]{display:none}
    .screen{background:var(--card);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:19px;min-height:174px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow)}.expression{min-height:29px;text-align:right;color:var(--muted);font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}.result{text-align:right;font:750 clamp(38px,12vw,58px)/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-x:auto;white-space:nowrap}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.actions button{border:1px solid var(--line);background:var(--soft);color:var(--deep);border-radius:13px;padding:11px 8px;font-size:12px;font-weight:800}.actions svg,.item-actions svg{width:15px;height:15px;vertical-align:-3px;margin-right:5px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.key{height:60px;border:1px solid var(--line);border-radius:19px;background:var(--key);font-size:22px;font-weight:680;box-shadow:0 6px 18px #366c6410;touch-action:manipulation}.key:active{transform:scale(.96);filter:brightness(.96)}.key.utility{color:var(--danger)}.key.op{color:var(--deep);background:var(--soft)}.key.equal{background:linear-gradient(145deg,#66d7c6,var(--accent));color:#073f39;border:0;box-shadow:0 9px 24px #24a99840}.key.zero{grid-column:span 2}
    .history-head{display:flex;align-items:end;justify-content:space-between;margin-top:5px}.history-head h2{font-size:15px;margin:0}.history-head span{font-size:10px;color:var(--muted)}.history{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}.empty{text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:17px;padding:22px}.item{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:7px 12px;align-items:center}.item .equation{font:700 17px ui-monospace,monospace;overflow-wrap:anywhere}.item .date{font-size:10px;color:var(--muted)}.item-actions{grid-row:1/3;grid-column:2;display:flex;gap:6px}.item-actions button{border:0;background:var(--soft);color:var(--deep);border-radius:10px;padding:9px;font-size:0}.item-actions svg{margin:0}
    .dialog-wrap{position:fixed;inset:0;background:#07131280;display:grid;place-items:end center;padding:16px;z-index:20}.dialog-wrap[hidden]{display:none}.dialog{width:min(100%,480px);background:var(--bg);border:1px solid var(--line);border-radius:25px;padding:20px;box-shadow:0 25px 80px #0005}.dialog h2{font-size:19px;margin:0 0 8px}.dialog p{font-size:13px;color:var(--muted);line-height:1.65;margin:0}.steps{margin:15px 0 18px;padding:0;list-style:none;display:grid;gap:9px;counter-reset:step}.steps li{counter-increment:step;display:flex;gap:9px;font-size:13px;align-items:center}.steps li:before{content:counter(step);width:25px;height:25px;border-radius:50%;background:var(--soft);color:var(--deep);display:grid;place-items:center;font-weight:900;flex:0 0 auto}.dialog-close{width:100%;border:0;border-radius:14px;padding:12px;background:var(--accent);color:#073f39;font-weight:900}.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);border-radius:999px;padding:10px 16px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:720px){.key{height:52px}.screen{min-height:145px}.history{max-height:175px}}
  </style>
</head>
<body>
  <main class="app"><header><div class="brand"><div class="logo">=</div><div><h1>算算</h1><p>算完、複製、分享</p></div></div><button id="install" class="install">安裝 App</button></header>
    <section class="screen" aria-live="polite"><div id="expression" class="expression">準備開始計算</div><div id="result" class="result">0</div><div class="actions"><button id="copy-full"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>複製完整算式</button><button id="share-full"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>分享到其他 App</button></div></section>
    <section class="keys" aria-label="計算機按鍵"><button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="back">⌫</button><button class="key op" data-value="÷">÷</button><button class="key op" data-value="×">×</button><button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key op" data-value="-">−</button><button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key op" data-value="+">+</button><button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key equal" data-action="equals">=</button><button class="key zero" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key op" data-action="percent">%</button></section>
    <div class="history-head"><h2>最近計算</h2><span>只存在這台裝置・30 天後清除</span></div><section id="history" class="history"></section>
  </main>
  <div id="install-dialog" class="dialog-wrap" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="install-title"><h2 id="install-title">安裝「算算」</h2><p id="install-intro"></p><ol id="install-steps" class="steps"></ol><button id="dialog-close" class="dialog-close">我知道了</button></section></div><div id="toast" class="toast" role="status"></div><script src="./app.js"></script>
</body></html>
